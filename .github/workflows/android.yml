name: Android CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.1.0
      - name: Branding check
        run: bash scripts/check_branding.sh
      - name: Unit tests
        run: gradle :app:testDebugUnitTest --stacktrace
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Stamp PROJECT_INFO with the real build time
        if: success()
        run: bash scripts/update_project_info.sh SUCCESS
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: zunivo-debug
          path: |
            app/build/outputs/apk/debug/*.apk
            PROJECT_INFO.txt
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: reports
          path: app/build/reports
